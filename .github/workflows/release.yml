name: Release to TestFlight

# Triggered by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
# All signing secrets live in the protected `app-store` environment, which
# requires a maintainer's approval and only accepts v* tags — so neither pull
# requests nor forks can ever reach them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  testflight:
    name: Build, sign & upload
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure the tag is on main
        run: |
          git fetch --no-tags --depth=200 origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true

      - name: Trust github.com SSH host key (for the match repo)
        run: |
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta \
            | python3 -I -c 'import json,sys; [print("github.com "+k) for k in json.load(sys.stdin)["ssh_keys"]]' \
            >> ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane release

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: ~/Library/Logs/gym
          retention-days: 14
          if-no-files-found: ignore
