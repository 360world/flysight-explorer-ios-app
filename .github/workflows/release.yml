name: Release

# Triggered by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
#
# 1. testflight      builds, signs and uploads to TestFlight. All signing secrets
#                    live in the protected `app-store` environment, which only
#                    accepts v* tags and `main` (for the listing workflow) and
#                    needs a maintainer's approval — pull requests and forks
#                    never reach them.
# 2. github-release  only after a successful upload: creates the GitHub Release
#                    with notes generated from the PRs merged since the last
#                    release (categories: .github/release.yml). This job has no
#                    access to signing secrets; it only gets permission to
#                    create releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_APP: /Applications/Xcode_27.1.app

jobs:
  testflight:
    name: Build, sign & upload
    runs-on: xcode-27 # preview image; macos-26 only has Xcode 26
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history + tags, for the TestFlight changelog

      - name: Make sure the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          bundler-cache: true

      - name: Trust github.com SSH host key (for the match repo)
        env:
          # Authenticated request: anonymous API calls from shared runners
          # hit GitHub's per-IP rate limit and fail with 403.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Build and upload to TestFlight
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane release

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: ~/Library/Logs/gym
          retention-days: 14
          if-no-files-found: ignore

  github-release:
    name: Publish GitHub Release
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
