name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App version
      placeholder: "1.0 (12)"
  - type: input
    id: ios
    attributes:
      label: iOS version and iPhone model
      placeholder: "iOS 26.5, iPhone 17"
  - type: input
    id: firmware
    attributes:
      label: FlySight firmware version (if relevant)
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: Copy from the app's log screen if available. Remove locations you don't want to share.
      render: text
