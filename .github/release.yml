# Categories for the automatically generated GitHub Release notes.
# A PR goes into the first category whose label it has. Label your PRs!
changelog:
  exclude:
    labels:
      - skip-changelog
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: 🚀 New features
      labels: [enhancement]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 📖 Documentation
      labels: [documentation]
    - title: 🧰 Other changes
      labels: ["*"]
